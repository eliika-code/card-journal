<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Card Journal</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="app">

    <h1>Card Journal</h1>


    <!-- ==============================
         質問・カード選択
    =============================== -->

    <section class="card">

      <label for="question">質問</label>

      <textarea
        id="question"
        placeholder="例：今の私に必要なことは？"
      ></textarea>


      <!-- デッキ単位のアコーディオン。将来デッキを増やしやすい形です -->
      <details class="deck-menu">
        <summary>🃏 大アルカナ</summary>

        <div class="deck-actions">
          <button id="drawTarotButton">
            1枚引き
          </button>

          <button id="drawThreeTarotButton">
            3枚引き
          </button>

          <button id="showChoiceFormButton">
            2択・5枚引き
          </button>

          <!-- 2択を選んだときだけJavaScriptで表示します -->
          <div id="choiceForm" class="choice-form" hidden>
            <label for="choiceA">選択肢A</label>
            <input
              id="choiceA"
              type="text"
              placeholder="例：家で原稿を書く"
            >

            <label for="choiceB">選択肢B</label>
            <input
              id="choiceB"
              type="text"
              placeholder="例：出かける"
            >

            <button id="drawChoiceTarotButton">
              5枚を引く
            </button>

            <p id="choiceMessage" class="input-message"></p>
          </div>
        </div>
      </details>

      <details class="deck-menu oracle-menu">
        <summary>🌊 水鏡の問いかけ</summary>

        <div class="deck-actions">
          <button id="drawOracleButton">
            1枚引き
          </button>
        </div>
      </details>

    </section>



    <!-- ==============================
         結果
    =============================== -->

    <section
      class="card result-area"
      id="resultArea"
    >

      <h2>結果</h2>

      <p id="deckName"></p>


      <!-- 1枚引き用 -->
      <div id="singleResult">

        <img
          id="cardImage"
          class="card-image"
          src=""
          alt=""
          hidden
        >

        <p id="cardName">
          まだカードを引いていません
        </p>

        <p id="cardMeaning"></p>

        <p id="oracleQuestion"></p>

      </div>


      <!-- 3枚引き・2択5枚引き用 -->
      <div
        id="multipleCardResult"
        hidden
      ></div>


      <label for="memo">
        感じたことメモ
      </label>

      <textarea
        id="memo"
        placeholder="カードを見て感じたことを書く"
      ></textarea>


      <button id="saveButton">
        保存する
      </button>

      <p id="saveMessage"></p>

    </section>



    <!-- ==============================
         履歴
    =============================== -->

    <section class="card">

      <h2>履歴</h2>

      <div id="historyList"></div>

    </section>

  </main>


  <script src="script.js"></script>

</body>

</html>
