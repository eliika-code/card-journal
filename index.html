<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Card Journal</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="app">

    <h1>Card Journal</h1>


    <!-- ==============================
         質問・カード選択
    =============================== -->

    <section class="card">

      <label for="question">質問</label>

      <textarea
        id="question"
        placeholder="例：今の私に必要なことは？"
      ></textarea>


      <button id="drawTarotButton">
        🃏 大アルカナを1枚引く
      </button>


      <button id="drawThreeTarotButton">
        🃏 大アルカナを3枚引く
      </button>


      <button id="drawOracleButton">
        🌊 水鏡の問いかけを引く
      </button>

    </section>



    <!-- ==============================
         結果
    =============================== -->

    <section
      class="card result-area"
      id="resultArea"
    >

      <h2>結果</h2>

      <p id="deckName"></p>


      <!-- 1枚引き用 -->
      <div id="singleResult">

        <img
          id="cardImage"
          class="card-image"
          src=""
          alt=""
          hidden
        >

        <p id="cardName">
          まだカードを引いていません
        </p>

        <p id="cardMeaning"></p>

        <p id="oracleQuestion"></p>

      </div>


      <!-- 3枚引き用 -->
      <div
        id="threeCardResult"
        hidden
      ></div>


      <label for="memo">
        感じたことメモ
      </label>

      <textarea
        id="memo"
        placeholder="カードを見て感じたことを書く"
      ></textarea>


      <button id="saveButton">
        保存する
      </button>

      <p id="saveMessage"></p>

    </section>



    <!-- ==============================
         履歴
    =============================== -->

    <section class="card">

      <h2>履歴</h2>

      <div id="historyList"></div>

    </section>

  </main>


  <script src="script.js"></script>

</body>

</html>
